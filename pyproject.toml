[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "zetir-repro"
version = "0.1.0"
description = "Research implementation and reproducible reconstruction tools for ZeTIR"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "networkx>=3.1"]
[project.optional-dependencies]
nlp = ["sentence-transformers>=3.0,<6", "spacy>=3.7,<4", "faiss-cpu>=1.8"]
data = ["datasets>=3.0,<5", "huggingface-hub>=0.23"]
generation = ["torch>=2.2", "transformers>=4.44,<5", "accelerate>=0.33", "bitsandbytes>=0.43"]
evaluation = ["rouge-score>=0.1.2", "bert-score>=0.3.13"]
test = ["pytest>=8.0"]
[tool.setuptools.packages.find]
where = ["."]
include = ["zetir*"]
